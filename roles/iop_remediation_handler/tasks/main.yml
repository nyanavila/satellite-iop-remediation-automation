--- 
  - name: Fetch Local IOP Remediation Playbook from Satellite REST API 
    ansible.builtin.uri: 
      url: "{{ satellite_url }}/katello/api/v2/remediations/{{ iop_plan_id }}/playbook" 
      method: GET 
      user: "{{ satellite_username }}" 
      password: "{{ satellite_password }}" 
      force_basic_auth: true 
      status_code: 200 
      return_content: true 
      validate_certs: "{{ validate_certs }}" 
    register: iop_playbook_response 
    
  - name: Save Fetched Remediation Playbook to Local Disk 
    ansible.builtin.copy: 
      content: "{{ iop_playbook_response.content }}" 
      dest: "{{ temp_playbook_path }}" 
      mode: '0600' 
      
  - name: Display Retrieved Remediation Playbook Content Summary 
    ansible.builtin.debug: 
      msg: "Successfully retrieved IOP Plan ID {{ iop_plan_id }}. Playbook size: {{ iop_playbook_response.content | length }} bytes."
